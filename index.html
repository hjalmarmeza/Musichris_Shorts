<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusiChris Executive Control</title>
    
        <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="app_logic.js?v=41.1"></script>

    <style>
        :root { --gold: #D4AF37; --dark: #000000; --glass: rgba(10, 10, 10, 0.75); }
        body { background: var(--dark); font-family: 'Inter', sans-serif; color: #FFF; margin: 0; padding: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* Fondo de Humo Cinematográfico */
        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: url('smoke.png');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            filter: contrast(1.2) brightness(0.8);
            animation: smokeMove 60s infinite alternate ease-in-out;
        }

        @keyframes smokeMove {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(2%, 1%); }
        }
        
        .glass-card { 
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .glass-card:hover { 
            border-color: rgba(212, 175, 55, 0.2);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
        }

        .gold-glow { text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        
        .premium-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #B58D1E 100%);
            box-shadow: 0 4px 15px rgba(181, 141, 30, 0.3);
            transition: all 0.3s ease;
        }
        
        .premium-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(181, 141, 30, 0.4);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    </style>
</head>
<body class="antialiased overflow-x-hidden selection:bg-amber-500/30">
    <div class="mesh-bg"></div>
    <div id="root"></div>

    <script src="react_app.js?v=41.2"></script>
    <div style="position: fixed; bottom: 8px; right: 15px; font-size: 10px; color: #D4AF37; font-family: 'Inter', sans-serif; pointer-events: none; letter-spacing: 1px; font-weight: 800; opacity: 0.6; z-index: 50;">
        v41.1
    </div>
</body>
</html>
